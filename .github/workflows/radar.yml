name: Freelance Radar

on:
  workflow_dispatch:
  schedule:
        - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run parser
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Save radar data
        if: always()
        run: |
          git config user.name "Freelance Radar"
          git config user.email "radar@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update radar data"
          git push